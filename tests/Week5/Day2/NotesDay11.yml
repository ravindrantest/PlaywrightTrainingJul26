Understanding CommonJS vs ES Modules in Node.js

CommonJS vs ES Modules Comparison


| Feature                  | CommonJS       | ES Modules |
| ------------------------ | -------------- | ---------- |
| Import                   | require()      | import     |
| Export                   | module.exports | export     |
| File Extension           | Optional       | Mandatory  |
| Default in Old Node.js   | Yes            | No         |
| Browser Support          | No             | Yes        |
| Modern Standard          | No             | Yes        |
| Recommended for New Apps | No             | Yes        |


