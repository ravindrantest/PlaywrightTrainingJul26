Page Object Model :

POM means:

Each web page (or module) of your application is represented by a separate class,
and that class contains locators and methods that act on that page.

While desiging POM things to do:

1. Inheritance => mutilevel inheritance
2. Abstraction => playwright wrapper class
3. Data parameterization => json, env, faker(synthetic data)
4. Custom Fixture => Used to create ready made objects

Inheritance

abstract class -> loginPage --> welcomePage --> leadPage --> CreateLeadPage --> ViewLeadPage


